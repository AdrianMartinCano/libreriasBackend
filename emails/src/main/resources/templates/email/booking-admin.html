<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/><title>Nueva reserva</title></head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:32px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
        <tr>
          <td style="background:#0f0f0f;padding:24px 40px;">
            <p style="color:#c9a84c;font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.1em;">Nueva reserva recibida</p>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9;border-radius:6px;padding:24px;">
              <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">
                <span style="color:#999;font-size:12px;text-transform:uppercase;">Cliente</span><br/>
                <strong style="color:#1a1a1a;" th:text="${booking.clientName}">-</strong>
              </td></tr>
              <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">
                <span style="color:#999;font-size:12px;text-transform:uppercase;">Email</span><br/>
                <a th:href="'mailto:' + ${booking.clientEmail}" th:text="${booking.clientEmail}"
                   style="color:#c9a84c;">-</a>
              </td></tr>
              <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">
                <span style="color:#999;font-size:12px;text-transform:uppercase;">Teléfono</span><br/>
                <a th:href="'tel:' + ${booking.clientPhone}" th:text="${booking.clientPhone}"
                   style="color:#c9a84c;" th:if="${booking.studioPhone != null}">-</a>
              </td></tr>
              <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">
                <span style="color:#999;font-size:12px;text-transform:uppercase;">Servicio</span><br/>
                <strong style="color:#1a1a1a;" th:text="${booking.serviceName}">-</strong>
              </td></tr>
              <tr><td style="padding:8px 0;border-bottom:1px solid #eee;">
                <span style="color:#999;font-size:12px;text-transform:uppercase;">Fecha y hora</span><br/>
                <strong style="color:#1a1a1a;"><span th:text="${booking.date}">-</span> a las <span th:text="${booking.time}">-</span></strong>
              </td></tr>
              <tr th:if="${booking.notes != null and !booking.notes.isEmpty()}">
                <td style="padding:8px 0;">
                  <span style="color:#999;font-size:12px;text-transform:uppercase;">Notas</span><br/>
                  <span style="color:#555;" th:text="${booking.notes}">-</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
