<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Backend Logo: Cubos modulares formando un engranaje -->
  <defs>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Centro: Símbolo {} -->
  <g transform="translate(128, 128)">
    <!-- Llaves de código en el centro -->
    <text x="0" y="0" font-size="48" font-weight="bold" fill="url(#gradOrange)" text-anchor="middle" dominant-baseline="central" font-family="monospace">{}</text>

    <!-- Engranaje exterior: cubos distribuidos en círculo -->

    <!-- Cubo superior (90°): radio 80 -->
    <g transform="translate(0, -80)">
      <rect x="-14" y="-14" width="28" height="28" fill="#f97316" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo superior derecha (45°): radio 80 -->
    <g transform="translate(57, -57)">
      <rect x="-14" y="-14" width="28" height="28" fill="#f97316" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo derecha (0°): radio 80 -->
    <g transform="translate(80, 0)">
      <rect x="-14" y="-14" width="28" height="28" fill="#f97316" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo inferior derecha (-45°): radio 80 -->
    <g transform="translate(57, 57)">
      <rect x="-14" y="-14" width="28" height="28" fill="#ea580c" opacity="0.85"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#f97316" opacity="0.6"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#c2410c" opacity="0.75"/>
    </g>

    <!-- Cubo inferior (-90°): radio 80 -->
    <g transform="translate(0, 80)">
      <rect x="-14" y="-14" width="28" height="28" fill="#ea580c" opacity="0.85"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#f97316" opacity="0.6"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#c2410c" opacity="0.75"/>
    </g>

    <!-- Cubo inferior izquierda (-135°): radio 80 -->
    <g transform="translate(-57, 57)">
      <rect x="-14" y="-14" width="28" height="28" fill="#c2410c" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#f97316" opacity="0.6"/>
    </g>

    <!-- Cubo izquierda (-180°): radio 80 -->
    <g transform="translate(-80, 0)">
      <rect x="-14" y="-14" width="28" height="28" fill="#c2410c" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#f97316" opacity="0.6"/>
    </g>

    <!-- Cubo superior izquierda (135°): radio 80 -->
    <g transform="translate(-57, -57)">
      <rect x="-14" y="-14" width="28" height="28" fill="#c2410c" opacity="0.9"/>
      <polygon points="-14,-14 -1,-25 27,-25 14,-14" fill="#ea580c" opacity="0.7"/>
      <polygon points="14,-14 27,-25 27,14 14,24" fill="#f97316" opacity="0.6"/>
    </g>

  </g>

  <!-- Círculo decorativo alrededor del engranaje -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#gradOrange)" stroke-width="2" opacity="0.3"/>

</svg>