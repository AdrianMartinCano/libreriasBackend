<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Backend Logo: Cubos modulares formando un engranaje -->
  <defs>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Centro: Símbolo {} -->
  <g transform="translate(128, 128)">
    <!-- Llaves de código en el centro -->
    <text x="0" y="0" font-size="48" font-weight="bold" fill="url(#gradOrange)" text-anchor="middle" dominant-baseline="central" font-family="monospace">{}</text>

    <!-- Engranaje exterior: cubos distribuidos en círculo -->

    <!-- Cubo superior (90°): radio 75 -->
    <g transform="translate(0, -75)">
      <rect x="-12" y="-12" width="24" height="24" fill="#f97316" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo superior derecha (45°): radio 75 -->
    <g transform="translate(53, -53)">
      <rect x="-12" y="-12" width="24" height="24" fill="#f97316" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo derecha (0°): radio 75 -->
    <g transform="translate(75, 0)">
      <rect x="-12" y="-12" width="24" height="24" fill="#f97316" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#c2410c" opacity="0.8"/>
    </g>

    <!-- Cubo inferior derecha (-45°): radio 75 -->
    <g transform="translate(53, 53)">
      <rect x="-12" y="-12" width="24" height="24" fill="#ea580c" opacity="0.85"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#f97316" opacity="0.6"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#c2410c" opacity="0.75"/>
    </g>

    <!-- Cubo inferior (-90°): radio 75 -->
    <g transform="translate(0, 75)">
      <rect x="-12" y="-12" width="24" height="24" fill="#ea580c" opacity="0.85"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#f97316" opacity="0.6"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#c2410c" opacity="0.75"/>
    </g>

    <!-- Cubo inferior izquierda (-135°): radio 75 -->
    <g transform="translate(-53, 53)">
      <rect x="-12" y="-12" width="24" height="24" fill="#c2410c" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#f97316" opacity="0.6"/>
    </g>

    <!-- Cubo izquierda (-180°): radio 75 -->
    <g transform="translate(-75, 0)">
      <rect x="-12" y="-12" width="24" height="24" fill="#c2410c" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#f97316" opacity="0.6"/>
    </g>

    <!-- Cubo superior izquierda (135°): radio 75 -->
    <g transform="translate(-53, -53)">
      <rect x="-12" y="-12" width="24" height="24" fill="#c2410c" opacity="0.9"/>
      <polygon points="-12,-12 -1,-21 23,-21 12,-12" fill="#ea580c" opacity="0.7"/>
      <polygon points="12,-12 23,-21 23,12 12,21" fill="#f97316" opacity="0.6"/>
    </g>

  </g>

  <!-- Círculo decorativo alrededor del engranaje -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="url(#gradOrange)" stroke-width="2" opacity="0.3"/>

</svg>