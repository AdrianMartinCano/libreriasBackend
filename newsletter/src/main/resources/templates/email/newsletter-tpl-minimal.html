<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${subject}">Newsletter</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;max-width:600px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,0.06);">

        <!-- Barra de acento -->
        <tr>
          <td th:style="'background:' + ${brand.accentColor} + ';height:4px;line-height:4px;font-size:0;'">&nbsp;</td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:40px;color:#333;font-size:15px;line-height:1.7;">
            <div th:utext="${body}">Contenido de la newsletter</div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background:#f9f9f9;padding:28px 40px;text-align:center;border-top:1px solid #eee;">
            <p style="color:#999;font-size:12px;line-height:1.7;margin:0;">
              Recibes este email porque te suscribiste a la newsletter de <span th:text="${brand.name}">la marca</span>.<br/>
              Si no quieres seguir recibiendo novedades,
              <a th:href="${unsubscribeUrl}" th:style="'color:' + ${brand.accentColor} + ';font-weight:600;text-decoration:underline;'">puedes darte de baja aquí</a>.
            </p>
          </td>
        </tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
