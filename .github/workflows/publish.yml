name: Publish Spring Boot modules to GitHub Packages

on:
  push:
    tags:
      - 'v*'   # se dispara con: git tag v1.0.1 && git push --tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github-adrianmartincano</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Sin --pl: se despliega el reactor entero, o sea los <module> del POM padre.
      # Antes iba con una lista de módulos escrita aquí, que había que acordarse de
      # ampliar al añadir uno. Al olvidarlo, el módulo nuevo no se publicaba y quien
      # lo pusiera en su pom se encontraba un 404 de GitHub Packages.
      - name: Deploy to GitHub Packages
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
